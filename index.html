<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="vDaFzC44iTRR_ZRCcbXOOgLFRfPGBgWgz2-ClPRYAHg" />
    <title>짝사랑 분석 테스트</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <!-- 시작 화면 -->
    <section id="start-screen">
        <div class="icon">💘</div>

        <h1>짝사랑 분석 테스트</h1>

        <p class="subtitle">
            당신의 마음은 지금 어느 정도일까요?
        </p>

        <p class="description">
            짝사랑에 관한 여러 질문에 답하면<br>
            당신의 마음과 현재 관계를 분석해드립니다.
        </p>

        <button onclick="startTest()">테스트 시작하기</button>
    </section>


    <!-- 질문 화면 -->
    <section id="question-screen" class="hidden">

        <div class="progress-area">
            <div class="progress-text">
                <span id="question-number">1</span> / <span id="total-questions">10</span>
            </div>

            <div class="progress-bar">
                <div id="progress"></div>
            </div>
        </div>

        <div class="question-box">

            <h2 id="question"></h2>

            <div id="answers"></div>

        </div>

        <button id="next-button" onclick="nextQuestion()" disabled>
            다음
        </button>

    </section>


    <!-- 결과 화면 -->
    <section id="result-screen" class="hidden">

        <div class="result-icon">💘</div>

        <p class="result-label">당신의 짝사랑 온도</p>

        <div class="score">
            <span id="score">0</span>
            <span class="score-percent">%</span>
        </div>

        <h2 id="result-title"></h2>

        <p id="result-description"></p>


        <div class="stats">

            <div class="stat">
                <div class="stat-top">
                    <span>❤️ 좋아하는 정도</span>
                    <strong id="love-score">0</strong>
                </div>

                <div class="stat-bar">
                    <div id="love-bar"></div>
                </div>
            </div>


            <div class="stat">
                <div class="stat-top">
                    <span>🧠 마음의 깊이</span>
                    <strong id="mind-score">0</strong>
                </div>

                <div class="stat-bar">
                    <div id="mind-bar"></div>
                </div>
            </div>


            <div class="stat">
                <div class="stat-top">
                    <span>👀 관심 신호</span>
                    <strong id="interest-score">0</strong>
                </div>

                <div class="stat-bar">
                    <div id="interest-bar"></div>
                </div>
            </div>


            <div class="stat">
                <div class="stat-top">
                    <span>💬 관계 발전 가능성</span>
                    <strong id="possibility-score">0</strong>
                </div>

                <div class="stat-bar">
                    <div id="possibility-bar"></div>
                </div>
            </div>

        </div>


        <div class="analysis-box">

            <h3>📊 현재 관계 분석</h3>

            <p id="relationship-analysis"></p>

        </div>


        <div class="advice-box">

            <h3>🎯 앞으로 이렇게 해보세요</h3>

            <p id="advice"></p>

        </div>


        <div class="warning-box">

            <h3>⚠️ 주의할 점</h3>

            <p id="warning"></p>

        </div>


        <button onclick="restartTest()">
            다시 테스트하기
        </button>

    </section>

</div>

<script src="script.js"></script>

</body>
</html>
